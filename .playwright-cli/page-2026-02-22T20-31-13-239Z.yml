            - paragraph [ref=e144]: Met de app kun je al je particuliere verzekeringen bij Centraal Beheer bekijken. Per verzekering zie je jouw polis en nota. Ook andere handige documenten zoals je groene kaart of voorwaarden zie je in de app.
          - generic [ref=e145]:
            - checkbox "Kan ik mijn financiële zaken regelen via de app?" [ref=e146]
            - generic [ref=e147] [cursor=pointer]:
              - heading "Kan ik mijn financiële zaken regelen via de app?" [level=3] [ref=e148]
              - img [ref=e150]
            - generic [ref=e153]: Heb je via ons een spaar- of beleggingsrekening? Dan geeft de app een overzicht van je spaarsaldo of het rendement van jouw beleggingen. En kun je geld overboeken of beleggingen aan- of verkopen. Heb je via ons een hypotheek? Dan kun je via de app extra aflossen of jouw bouwdepot beheren. Zo heb je al jouw financiële zaken bij Centraal Beheer in 1 overzicht. Dat is lekker overzichtelijk!
          - generic [ref=e154]:
            - checkbox "Kan ik een schade melden via de app?" [ref=e155]
            - generic [ref=e156] [cursor=pointer]:
              - heading "Kan ik een schade melden via de app?" [level=3] [ref=e157]
              - img [ref=e159]
            - paragraph [ref=e162]: Via onze app meld je makkelijk schade, of je nu thuis bent of onderweg. Geef door wanneer, waar en hoe de schade is ontstaan. En voeg meteen foto’s toe. Bij blik- of ruitschade kun je meteen een afspraak maken met een schadeherstelbedrijf bij jou in de buurt. Je krijgt binnen 2 werkdagen een reactie van ons. En je volgt jouw schademelding via de app. Zo ben je altijd op de hoogte.
          - generic [ref=e163]:
            - checkbox "Kan ik de app ook op meerdere apparaten gebruiken?" [ref=e164]
            - generic [ref=e165] [cursor=pointer]:
              - heading "Kan ik de app ook op meerdere apparaten gebruiken?" [level=3] [ref=e166]
              - img [ref=e168]
            - generic [ref=e170]: Ja, je kunt de app op meerdere apparaten tegelijk gebruiken. Bijvoorbeeld op je iPad en op je telefoon. Soms is niet overal dezelfde informatie te zien. Bijvoorbeeld als je jouw spaar- of beleggingsrekening een persoonlijke naam gaf.
          - generic [ref=e171]:
            - checkbox "Welke producten kan ik zien in de app?" [ref=e172]
