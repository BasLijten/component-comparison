      - article [ref=e194]:
        - generic [ref=e198]:
          - heading "Heb je inlogproblemen in de app?" [level=2] [ref=e199]
          - paragraph [ref=e201]: Door een technische storing kan het inloggen tijdelijk verstoord zijn. Onze excuses voor het ongemak. We werken aan een oplossing. Probeer het later nog eens of log in via Mijn Centraal Beheer.
          - generic [ref=e202]:
            - checkbox "Ik krijg een foutmelding als ik opnieuw inlog in de app" [ref=e203]
            - generic [ref=e204] [cursor=pointer]:
              - heading "Ik krijg een foutmelding als ik opnieuw inlog in de app" [level=3] [ref=e205]
              - img [ref=e207]
            - paragraph [ref=e210]: "Gebruik de inlogmethode die je bij ons hebt gekozen: inloggen met je gebruikersnaam, wachtwoord en sms-beveiliging. Of inloggen met iDIN. Weet je dit niet meer? Probeer dan eerst in te loggen met iDIN. Lukt dit niet? Probeer dan in te loggen met je gebruikersnaam. Krijg je een melding dat er een technisch probleem is? Probeer het dan (later) nog eens. Controleer ook of je browser op je telefoon in 'privémodus' staat. Dan lukt het inloggen niet. Zet de privémodus uit en probeer het nog eens."
          - generic [ref=e211]:
            - checkbox "Ik heb problemen met inloggen via iDIN in de app (o.a. iPhones)" [ref=e212]
            - generic [ref=e213] [cursor=pointer]:
              - heading "Ik heb problemen met inloggen via iDIN in de app (o.a. iPhones)" [level=3] [ref=e214]
              - img [ref=e216]
            - paragraph [ref=e219]: Log je in met iDIN en heb je problemen bij het inloggen bij de bank? Opent bijvoorbeeld je bankapp niet? Dit komt voor als je Chrome gebruikt als browser op een iPhone. iPhones blokkeren soms acties in Chrome en werken beter met de browser Safari. Kies bij Instellingen voor Safari als standaardapp.
          - generic [ref=e220]:
            - checkbox "Waarom moet ik opnieuw inloggen in de app?" [ref=e221]
            - generic [ref=e222] [cursor=pointer]:
              - heading "Waarom moet ik opnieuw inloggen in de app?" [level=3] [ref=e223]
              - img [ref=e225]
            - paragraph [ref=e228]: Je account bij Centraal Beheer is beveiligd met iDIN of gebruikersnaam, wachtwoord en sms-code (Veilig Inloggen). Dat geldt zowel voor Mijn Centraal Beheer als voor de app. Met de app log je 1 keer in met de inlogmethode die jij hebt gekozen. Daarna open je de app gewoon met je pincode, vingerafdruk of gezichtsherkenning. Je hoeft dus niet steeds opnieuw in te loggen met iDIN of sms-code. Is er een grote update of download je de app opnieuw? Dan moet je soms wel weer opnieuw inloggen met iDIN of sms-beveiliging.
