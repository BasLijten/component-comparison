          - paragraph [ref=e83]: Ben je gewend om bij ons in te loggen met gebruikersnaam en wachtwoord? Vanaf 15 januari is sms-beveiliging verplicht. Je ontvangt een controlecode per sms nadat je je gebruikersnaam en wachtwoord hebt ingevuld. Heb je de sms-beveiliging nog niet aangezet? Dan kun je dat direct regelen als je inlogt.
