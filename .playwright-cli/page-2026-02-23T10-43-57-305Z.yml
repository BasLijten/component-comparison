                - /url: https://www.centraalbeheer.nl/login-idin?returnUrl=/mijncb
              - text: jouw inlogmethode bij ons (via je eigen bank). Als je inloggen met iDIN hebt aangezet, hebben wij je gebruikersnaam en wachtwoord verwijderd om misbruik te voorkomen. Probeer daarom eerst in te loggen met iDIN. Lukt dat ook niet? Vraag dan je gebruikersnaam op via ‘
              - link "Gebruikersnaam vergeten" [ref=e94] [cursor=pointer]:
