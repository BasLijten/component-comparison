<!-- CB Content Accordion – class-stripped semantic skeleton -->
<article>
  <div>
    <div>
      <div>
        <div>
          <h2>[Section heading]</h2>
          <div>[Optional intro text]</div>

          <div>
            <input type="checkbox" id="[uid]" name="[group-name]">
            <label for="[uid]">
              <h3>[Item title]</h3>
              <span aria-hidden="true">[SVG chevron icon]</span>
            </label>
            <div>
              <div>[Answer content]</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</article>
