<!-- FBTO Accordion – class-stripped semantic skeleton -->
<div>
  <div itemscope itemtype="https://schema.org/Question" itemprop="mainEntity">
    <div>
      <h3>
        <button type="button" aria-expanded="false" itemprop="name">[Question text]</button>
      </h3>
      <div>
        <i aria-hidden="true"></i>
      </div>
    </div>
    <div itemscope itemtype="https://schema.org/Answer" itemprop="acceptedAnswer">
      <div itemprop="text">
        <p>[Answer text]</p>
      </div>
    </div>
  </div>
  <!-- Repeat for each item -->
</div>
